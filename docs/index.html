<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>羽球记 · 群内战绩与实力排名</title>
  <link rel="stylesheet" href="./app.css">
  <style>button{border:0}</style>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eaf0e4;color:#22332a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,select,input{font:inherit}button{cursor:pointer}select{color:#22332a;background:#f3f5ef;border:1px solid #dce4d3;border-radius:9px;padding:12px;width:100%;max-width:100%}input{border:1px solid transparent;width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid #699448;outline-offset:3px}button:hover{filter:brightness(.97)}.layout{max-width:1140px;margin:auto;min-height:100vh;padding:42px 60px;display:flex;align-items:center;gap:90px}.story{flex:1}.wordmark{display:flex;gap:14px;align-items:center;font-size:26px;font-weight:800}.shuttle{width:42px;height:42px;background:#1b6544;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#d9ee9d}.shuttle svg{width:29px}.story h1{font-size:58px;line-height:1.28;letter-spacing:-1.5px;margin:58px 0 20px}.story h1 em{font-style:normal;color:#386d48}.story p{max-width:380px;font-size:16px;line-height:1.9;color:#798674}.feature{display:flex;align-items:center;gap:14px;margin:20px 0;font-size:14px;color:#53664e}.feature .step{background:#dfe8d4;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#617653}.story-foot{margin-top:45px;border-top:1px solid #d2ddc9;padding-top:20px;font-size:12px;color:#83917b;line-height:1.8}.phone{width:402px;height:min(860px,calc(100vh - 80px));min-height:660px;flex-shrink:0;border:6px solid #22372c;border-radius:38px;box-shadow:0 30px 65px #36583220;overflow:hidden;display:flex;flex-direction:column;background:#f6f7f2;position:relative}.statusbar{height:38px;padding:13px 23px 4px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.statusbar .island{position:absolute;top:12px;left:calc(50% - 42px);width:84px;height:20px;background:#22372c;border-radius:20px}.native-nav{height:42px;display:flex;align-items:center;justify-content:center;position:relative;font-size:14px;font-weight:650;flex-shrink:0}.capsule{position:absolute;right:15px;border:1px solid #dfe4d7;border-radius:20px;padding:3px 11px;font-size:15px;letter-spacing:3px}.screen{overflow:auto;flex:1;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.screen .page{padding:18px 17px 24px}.screen .hero-title{margin:12px 0 8px}.tabbar{height:67px;flex-shrink:0;display:flex;background:#fff;border-top:1px solid #e5e9df;padding-bottom:7px}.tabbar button{flex:1;background:none;padding:10px 3px 7px;border-radius:0;color:#8b9887;font-weight:500;font-size:11px}.tabbar button.active{color:#196b47;font-weight:700}.tabbar svg{width:21px;height:21px;display:block;margin:0 auto 5px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.score-row input{width:95px!important}.score-row .muted{width:40px;flex-shrink:0}.score-row{gap:12px}.dialog{border:none;border-radius:22px;width:min(370px,90vw);padding:26px;box-shadow:0 25px 80px #122e3844;color:#22332a}.dialog::backdrop{background:#1f302854}.dialog h2{font-size:20px;margin:0 0 14px}.dialog p{font-size:14px;line-height:1.8;color:#73856e;margin-bottom:24px}.dialog-buttons{display:flex;gap:12px}.dialog-buttons button{flex:1}.screen .card{padding:15px}.screen .hero{padding:22px}.screen .match-teams{gap:6px}.screen .team{font-size:13px}.screen .result{font-size:23px;min-width:65px}.screen .chip{padding:9px 12px;font-size:12px}.screen .board-row{gap:12px}.screen .place{width:21px}.screen .avatar{width:36px;height:36px;font-size:15px}.screen .profile-head .avatar{width:57px;height:57px;font-size:22px}.screen .person-meta{font-size:11px}.screen .hero-sub{font-size:12px}.screen .badge{white-space:nowrap}.screen .profile-item{width:calc(50% - 4px)}.screen .profile-grid{gap:8px}.screen .person-name{font-size:14px}.screen .rating{font-size:19px}.screen .delta{font-size:10px}.screen .chips{gap:7px}.screen .team-select{gap:10px}.screen .team-select select{font-size:13px}.screen .stats{padding:16px 0}.screen .section-title{font-size:16px}.screen .muted{font-size:12px}.prototype-note{font-size:11px;color:#7b8c70;display:inline-block;padding:7px 12px;border:1px solid #bccbac;border-radius:16px;margin-top:25px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#22372c;color:#fff;border-radius:10px;padding:12px 22px;z-index:4;font-size:14px}.screen .notice{font-size:12px}.screen .full{margin-top:12px}.screen .row.gap{gap:8px}
    @media(max-width:900px){.layout{padding:20px;gap:30px}.story h1{font-size:42px}.story{max-width:330px}.phone{height:calc(100vh - 40px)}}@media(max-width:680px){body{background:#f6f7f2}.layout{display:block;padding:0;min-height:100dvh}.story{display:none}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.statusbar{display:none}.native-nav{height:46px}.screen .page{max-width:480px;margin:auto}.tabbar{height:72px;padding-bottom:env(safe-area-inset-bottom,8px)}}
  </style>
</head>
<body>
  <div style="background:#fff3d8;color:#765319;font-size:12px;padding:10px 18px;text-align:center;line-height:1.6">公网体验版：记录保存在当前浏览器，暂不跨设备共享。默认球友为虚构，可在「我的」切换身份体验确认。</div>
  <div class="layout">
    <aside class="story">
      <div class="wordmark"><div class="shuttle"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 23 8 6l6 1 4-3 4 3 6-1-2 17M10 23h16M14 7l2 16M22 7l-2 16M11 23c0 10 14 10 14 0"/></svg></div>羽球记 <span class="eyebrow">COURT CLUB</span></div>
      <h1>把每一次挥拍，<br><em>记下来。</em></h1>
      <p>熟悉的球友，新鲜的对阵。<br>把胜负留在记录里，把进步带到下一场。</p>
      <div style="margin-top:32px"><div class="feature"><span class="step">01</span>15 / 21 分，逐局添加与暂存</div><div class="feature"><span class="step">02</span>提交后 24 小时无异议自动计分</div><div class="feature"><span class="step">03</span>单打与双打，共同形成个人排名</div></div>
      <span class="prototype-note">公网体验版 · 数据保存在当前设备</span>
      <div class="story-foot">右侧展示网页的录入与排名流程。<br>虚构球友与比赛仅保存在当前浏览器，体验页尚未接入群内共享后台。</div>
    </aside>
    <section class="phone" aria-label="羽球记网页体验">
      <div class="statusbar"><span>9:41</span><div class="island"></div><span>▮▮▮  ▰</span></div>
      <div class="native-nav"><span id="nav-title">羽球记</span><span class="capsule">··· │ ◉</span></div>
      <main id="screen" class="screen" aria-live="polite"></main>
      <nav class="tabbar" aria-label="主导航">
        <button data-nav="home" class="active" aria-label="首页"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg>首页</button>
        <button data-nav="record" aria-label="记比赛"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>记比赛</button>
        <button data-nav="rankings" aria-label="排行榜"><svg viewBox="0 0 24 24"><path d="M3 20V11h5v9M9 20V4h6v16M16 20v-6h5v6"/></svg>排行榜</button>
        <button data-nav="profile" aria-label="我的"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3c0-7 16-7 16 0v3"/></svg>我的</button>
      </nav>
    </section>
  </div>
  <dialog id="dialog" class="dialog"></dialog>
  <script src="./domain.js"></script><script src="./demo.js"></script><script src="./app.js"></script>
</body></html>
